# Live Hong Kong relay since 2026-10-21.
# TCP splice only. This process does not parse HTTP.
# Install path: /etc/haproxy/haproxy.cfg
# Check: haproxy -c -f /etc/haproxy/haproxy.cfg && systemctl reload haproxy
# Do not run docker compose or update.sh on this machine.

global
	log /dev/log local0
	chroot /var/lib/haproxy
	stats socket /run/haproxy/admin.sock mode 660 level admin
	stats timeout 30s
	user haproxy
	group haproxy
	daemon
	maxconn 40000

defaults
	mode tcp
	log global
	option tcplog
	timeout connect 10s
	timeout client 3600s
	timeout server 3600s
	timeout tunnel 3600s

frontend asia_tls
	bind *:443
	default_backend origin_tls

backend origin_tls
	server new-origin 15.204.102.44:8443 send-proxy-v2
