global
	log /dev/log local0
	chroot /var/lib/haproxy
	stats socket /run/haproxy/admin.sock mode 660 level admin
	stats timeout 30s
	user haproxy
	group haproxy
	daemon
	maxconn 40000

defaults
	mode tcp
	log global
	option tcplog
	timeout connect 10s
	timeout client 3600s
	timeout server 3600s
	timeout tunnel 3600s

frontend asia_tls
	bind *:443
	tcp-request inspect-delay 5s
	tcp-request content accept if { req.ssl_hello_type 1 }
	acl sni_present req.ssl_sni -m found
	acl sni_ip req.ssl_sni -i 64.83.27.87
	acl sni_arpa req.ssl_sni -i 87.27.83.64.in-addr.arpa
	acl alpn_acme req.ssl_alpn acme-tls/1
	use_backend ip_tls if alpn_acme
	use_backend ip_tls if sni_ip
	use_backend ip_tls if sni_arpa
	use_backend ip_tls if !sni_present
	default_backend origin_tls

backend origin_tls
	server new-origin 15.204.102.44:8443 send-proxy-v2

backend ip_tls
	server local_caddy 127.0.0.1:9443 send-proxy-v2
